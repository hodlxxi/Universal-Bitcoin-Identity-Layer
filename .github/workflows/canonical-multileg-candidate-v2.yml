name: Canon V2 Multileg Candidate PostgreSQL

on:
  pull_request:
    paths:
      - "app/services/canonical_multileg_candidate_registry_v2.py"
      - "migrations/2026-11-13_canonical_multileg_admission_candidates_v2.sql"
      - "tests/integration/test_canonical_multileg_candidate_postgres_v2.py"
      - ".github/workflows/canonical-multileg-candidate-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  multileg-candidate-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: canonv2test
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: canonv2test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U canonv2test -d canonv2test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -r requirements.txt pytest PyJWT black==26.1.0 flake8==6.1.0
      - name: Test atomic multi-UTXO candidate and sponsor Full gate on disposable PostgreSQL
        env:
          APP_VERSION: "1.0.0-beta"
          TESTING: "1"
          FLASK_ENV: "testing"
          DATABASE_URL: "sqlite:///:memory:"
          CANON_V2_DISPOSABLE_PG_ACK: "1"
          CANON_V2_TEST_DATABASE_URL: "postgresql+psycopg2://canonv2test:disposable-ci-only@localhost:5432/canonv2test"
        run: |
          python -m pytest -q tests/integration/test_canonical_multileg_candidate_postgres_v2.py
      - name: Black
        run: |
          black --check --diff app/services/canonical_multileg_candidate_registry_v2.py tests/integration/test_canonical_multileg_candidate_postgres_v2.py
      - name: Flake8
        run: |
          flake8 app/services/canonical_multileg_candidate_registry_v2.py tests/integration/test_canonical_multileg_candidate_postgres_v2.py
