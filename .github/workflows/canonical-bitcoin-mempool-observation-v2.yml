name: Canon V2 Mempool Observation

on:
  pull_request:
    paths:
      - "app/services/canonical_bitcoin_mempool_observation_v2.py"
      - "tests/unit/test_canonical_bitcoin_mempool_observation_v2.py"
      - ".github/workflows/canonical-bitcoin-mempool-observation-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mempool-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -r requirements.txt pytest PyJWT black==26.1.0 flake8==6.1.0
      - name: Verify mempool-aware multi-UTXO failure-closed behavior
        env:
          APP_VERSION: "1.0.0-beta"
          TESTING: "1"
          FLASK_ENV: "testing"
          DATABASE_URL: "sqlite:///:memory:"
        run: |
          python -m pytest -q tests/unit/test_canonical_bitcoin_mempool_observation_v2.py tests/unit/test_canonical_multi_outpoint_mirror_v2.py
      - name: Black
        run: |
          black --check --diff app/services/canonical_bitcoin_mempool_observation_v2.py tests/unit/test_canonical_bitcoin_mempool_observation_v2.py
      - name: Flake8
        run: |
          flake8 app/services/canonical_bitcoin_mempool_observation_v2.py tests/unit/test_canonical_bitcoin_mempool_observation_v2.py
