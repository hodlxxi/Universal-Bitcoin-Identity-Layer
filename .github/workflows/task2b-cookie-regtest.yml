name: Task 2B Isolated Bitcoin Core Cookie Auth

on:
  pull_request:
    paths:
      - "tests/integration/isolated_bitcoin_regtest.py"
      - "tests/integration/test_task2b_regtest_cookie.py"
      - ".github/workflows/task2b-cookie-regtest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-cookie-regtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install project test dependencies
        run: |
          python -m pip install -r requirements.txt pytest
      - name: Fetch verified Bitcoin Core 29.0 test binary
        shell: bash
        run: |
          set -Eeuo pipefail
          archive="$RUNNER_TEMP/bitcoin-29.0-x86_64-linux-gnu.tar.gz"
          curl --fail --location --retry 3 --silent --show-error \
            https://bitcoincore.org/bin/bitcoin-core-29.0/bitcoin-29.0-x86_64-linux-gnu.tar.gz \
            --output "$archive"
          # Official guix.sigs release manifests independently agree on this hash.
          echo "a681e4f6ce524c338a105f214613605bac6c33d58c31dc5135bbc02bc458bb6c  $archive" \
            | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/bitcoin-29.0/bin/bitcoind" -version | head -n 1
      - name: Real isolated regtest cookie and invalid-credential test
        env:
          APP_VERSION: "1.0.0-beta"
          TESTING: "1"
          FLASK_ENV: testing
          DATABASE_URL: "sqlite:///:memory:"
        run: |
          CANON_V2_REGTEST_ACK=1 \
          CANON_V2_REGTEST_BINARY="$RUNNER_TEMP/bitcoin-29.0/bin/bitcoind" \
          python -m pytest -q tests/integration/test_task2b_regtest_cookie.py
