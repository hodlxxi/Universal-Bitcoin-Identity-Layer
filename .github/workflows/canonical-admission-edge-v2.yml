name: Canonical Admission Edge V2 Lineage

on:
  pull_request:
    paths:
      - "app/services/canonical_admission_edge_v2.py"
      - "tests/unit/test_canonical_admission_edge_v2.py"
      - ".github/workflows/canonical-admission-edge-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canon-v2-edge-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -r requirements.txt pytest PyJWT black==26.1.0 flake8==6.1.0
      - name: Canon V2 full finite lineage proof tests
        env:
          APP_VERSION: "1.0.0-beta"
          TESTING: "1"
          FLASK_ENV: "testing"
          DATABASE_URL: "sqlite:///:memory:"
        run: |
          python -m pytest -q tests/unit/test_canonical_admission_edge_v2.py
      - name: Validate Black formatting of new files
        run: |
          black --check --diff app/services/canonical_admission_edge_v2.py tests/unit/test_canonical_admission_edge_v2.py
      - name: Validate Flake8 of new files
        run: |
          flake8 app/services/canonical_admission_edge_v2.py tests/unit/test_canonical_admission_edge_v2.py
