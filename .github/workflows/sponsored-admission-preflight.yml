name: Sponsored Admission Preflight

on:
  pull_request:
    paths:
      - "app/services/sponsored_admission_import_preflight.py"
      - "tests/unit/test_sponsored_admission_import_preflight.py"
      - "app/services/sponsored_admission_funding_preflight.py"
      - "tests/unit/test_sponsored_admission_funding_preflight.py"
      - "app/services/mirrored_covenant_pair.py"
      - "app/services/canonical_admission_edge.py"
      - "app/services/canonical_sponsored_script_policy_v2.py"
      - "tests/unit/test_canonical_sponsored_script_policy_v2.py"
      - "app/services/canonical_admission_proposal_v2.py"
      - "tests/unit/test_canonical_admission_proposal_v2.py"
      - "app/services/canonical_admission_consent_v2.py"
      - "tests/unit/test_canonical_admission_consent_v2.py"
      - "app/services/canonical_admission_consent_challenge_storage_v2.py"
      - "tests/unit/test_canonical_admission_consent_challenge_storage_v2.py"
      - "migrations/2026-11-13_canonical_admission_consent_challenge_v2.sql"
      - "tests/integration/test_canonical_admission_consent_challenge_postgres_v2.py"
      - ".github/workflows/sponsored-admission-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sponsored-admission-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -r requirements.txt pytest PyJWT
      - name: Verify mirrored covenant and sponsored admission preflight
        env:
          APP_VERSION: "1.0.0-beta"
          TESTING: "1"
          FLASK_ENV: "testing"
          DATABASE_URL: "sqlite:///:memory:"
        run: |
          python -m pytest -q tests/unit/test_mirrored_covenant_pair.py tests/unit/test_sponsored_admission_import_preflight.py tests/unit/test_sponsored_admission_funding_preflight.py tests/unit/test_canonical_sponsored_script_policy_v2.py tests/unit/test_canonical_admission_proposal_v2.py tests/unit/test_canonical_admission_consent_v2.py tests/unit/test_canonical_admission_consent_challenge_storage_v2.py

  sponsored-admission-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: canonv2test
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: canonv2test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U canonv2test -d canonv2test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -r requirements.txt pytest PyJWT
      - name: Validate one-use challenge ledger in disposable PostgreSQL
        env:
          APP_VERSION: "1.0.0-beta"
          TESTING: "1"
          FLASK_ENV: "testing"
          DATABASE_URL: "sqlite:///:memory:"
          CANON_V2_TEST_DATABASE_URL: "postgresql+psycopg2://canonv2test:disposable-ci-only@localhost:5432/canonv2test"
        run: |
          python -m pytest -q tests/integration/test_canonical_admission_consent_challenge_postgres_v2.py
