name: Canon V2 Server Bitcoin Observation

on:
  pull_request:
    paths:
      - "app/services/canonical_v2_server_bitcoin_collateral.py"
      - "tests/unit/test_canonical_v2_server_bitcoin_collateral.py"
      - "docs/CANONICAL_V2_SERVER_BITCOIN_OBSERVATION.md"
      - ".github/workflows/canonical-v2-server-bitcoin.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-core-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -r requirements.txt pytest PyJWT black==26.1.0 flake8==6.1.0 isort==5.13.2
      - name: Verify bounded Bitcoin Core and fail-closed checks
        env:
          APP_VERSION: "1.0.0-beta"
          TESTING: "1"
          FLASK_ENV: "testing"
          DATABASE_URL: "sqlite:///:memory:"
        run: |
          python -m pytest -q tests/unit/test_canonical_v2_server_bitcoin_collateral.py
      - name: Black
        run: |
          black --check --diff app/services/canonical_v2_server_bitcoin_collateral.py tests/unit/test_canonical_v2_server_bitcoin_collateral.py
      - name: Flake8
        run: |
          flake8 app/services/canonical_v2_server_bitcoin_collateral.py tests/unit/test_canonical_v2_server_bitcoin_collateral.py
      - name: isort
        run: |
          isort --check-only --diff app/services/canonical_v2_server_bitcoin_collateral.py tests/unit/test_canonical_v2_server_bitcoin_collateral.py
